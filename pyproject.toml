[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rampart-llm"
version = "0.1.3"
description = "Policy-as-code guardrail enforcement for enterprise LLM applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "guardrails", "policy", "security", "pii", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "transformers>=4.40",
    "torch>=2.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.26"]
cortex = [
    "snowflake-snowpark-python>=1.0",
    "snowflake-ml-python>=1.0",
]
azure = []
openai = []
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/njt1980/rampart"
Repository = "https://github.com/njt1980/rampart"
Issues = "https://github.com/njt1980/rampart/issues"

[tool.hatch.build.targets.wheel]
packages = ["rampart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["rampart"]
omit = ["tests/*"]