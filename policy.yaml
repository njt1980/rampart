version: "1.0.0"
description: "Rampart try-it-out policy — Bedrock demo scenarios"

profiles:

  # Strict, customer-facing behaviour: block PII and injection attempts on the
  # way in, redact any PII the model echoes back on the way out.
  customer_facing:
    input:
      - guard: PiiGuard
        module: rampart.guards.pii
        engine: classifier
        action: block
        config:
          entities: [CREDIT_CARD, PHONE_NUMBER, EMAIL_ADDRESS]
          language: en

      - guard: PromptInjectionGuard
        module: rampart.guards.prompt_injection
        engine: classifier
        action: block
        config:
          threshold: 0.8

    output:
      - guard: PiiGuard
        module: rampart.guards.pii
        engine: classifier
        action: redact
        config:
          entities: [CREDIT_CARD, PHONE_NUMBER, EMAIL_ADDRESS]
          language: en

  # Internal tooling: staff legitimately discuss real customer PII, so the
  # input guard only watches for prompt injection. The output guard still
  # redacts anything the model repeats back, in case it echoes sensitive data.
  internal_tool:
    input:
      - guard: PromptInjectionGuard
        module: rampart.guards.prompt_injection
        engine: classifier
        action: block
        config:
          threshold: 0.9
    output:
      - guard: PiiGuard
        module: rampart.guards.pii
        engine: classifier
        action: redact
        config:
          entities: [CREDIT_CARD, PHONE_NUMBER, EMAIL_ADDRESS]
          language: en

  # Observability mode: every guard runs and is recorded in the audit trail,
  # but action is "allow" so nothing is ever blocked or modified. Useful for
  # measuring guard behaviour against real traffic before turning on enforcement.
  audit_only:
    input:
      - guard: PiiGuard
        module: rampart.guards.pii
        engine: classifier
        action: allow
        config:
          entities: [CREDIT_CARD, PHONE_NUMBER, EMAIL_ADDRESS]
          language: en

      - guard: PromptInjectionGuard
        module: rampart.guards.prompt_injection
        engine: classifier
        action: allow
        config:
          threshold: 0.8

  # Hybrid engine mode: the local classifier handles clear-cut cases, and only
  # ambiguous scores in the uncertainty band are escalated to an LLM judge on
  # Bedrock. Demonstrates engine: hybrid and the extra `llm` config block.
  hybrid_injection:
    input:
      - guard: PromptInjectionGuard
        module: rampart.guards.prompt_injection
        engine: hybrid
        action: block
        config:
          threshold: 0.8
          uncertainty_band: [0.4, 0.8]
          llm:
            provider: bedrock
            model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
            max_tokens: 10
